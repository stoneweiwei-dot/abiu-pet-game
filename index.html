<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e9e6d8"><title>阿 biu 的小日子</title><style>*{box-sizing:border-box}body{margin:0;background:#e8e6da;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:#35443e}.app{max-width:540px;margin:auto;min-height:100dvh;background:linear-gradient(#f8f5ec,#e7e9dc);padding:20px 18px 34px}header{display:flex;justify-content:space-between;align-items:center}h1{font-family:serif;font-size:30px;font-weight:500;margin:4px 0}.small{font-size:12px;color:#819087}.tag{border:1px solid #b5c4b6;border-radius:22px;padding:8px 12px;font-size:12px}.meters{display:flex;gap:9px;margin:18px 0}.meter{flex:1;font-size:11px;background:#ffffff80;border-radius:13px;padding:10px 8px;text-align:center}.bar{height:5px;background:#d7dfd3;border-radius:9px;margin-top:8px;overflow:hidden}.fill{height:100%;background:#7e9c8a;transition:width .3s}.room{position:relative;overflow:hidden;border-radius:26px;height:min(55vh,460px);min-height:330px;background:linear-gradient(#eee9db 0 67%,#d9c7aa 67%);box-shadow:0 18px 36px #5e685524}.window{position:absolute;left:8%;top:8%;width:43%;height:43%;border:9px solid #e6d5b8;border-radius:110px 110px 8px 8px;background:linear-gradient(#a3bbb6,#dce3ce);box-shadow:0 3px 8px #8c857347}.window:before{content:"";position:absolute;left:50%;height:100%;width:5px;background:#e6d5b8}.lamp{position:absolute;right:13%;top:14%;width:6px;height:52%;background:#9a8569}.lamp:before{content:"";position:absolute;top:-3%;left:-40px;width:86px;height:62px;border-radius:45px 45px 10px 10px;background:#e5d1a1;box-shadow:0 0 42px #f5dfad}.rug{position:absolute;bottom:5%;left:6%;width:88%;height:24%;border-radius:50%;background:#c7bba2;filter:blur(1px)}.cat{position:absolute;width:240px;max-width:80%;left:50%;bottom:15%;transform:translateX(-50%);transition:left .65s,bottom .65s,transform .65s;cursor:pointer;touch-action:manipulation;filter:drop-shadow(0 12px 9px #4a504744)}.cat.bounce{animation:bounce .55s}.cat.sleep{transform:translateX(-50%) scale(.9) rotate(-5deg)}@keyframes bounce{50%{transform:translateX(-50%) translateY(-22px)}}.bubble{position:absolute;top:10%;right:7%;background:#fffdf2e8;border-radius:19px 19px 5px 19px;padding:13px;max-width:48%;font-size:14px;box-shadow:0 4px 14px #7774}.message{text-align:center;padding:17px 0;font-size:15px;min-height:54px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.actions button{border:1px solid #d6dfd0;background:#fdfcf5;border-radius:17px;padding:15px 5px;color:#43584c;font-size:15px;box-shadow:0 4px 10px #9ca59018}.actions button:active{transform:scale(.95);background:#dce8d8}.note{text-align:center;margin-top:20px;color:#829084;font-size:11px}svg{display:block;width:100%}</style></head><body><main class="app"><header><div><div class="small">A BIU · LITTLE DAYS</div><h1>阿 biu 的小日子</h1></div><span class="tag">✦ 陪伴中</span></header><div class="meters" id="meters"></div><section class="room" aria-label="阿 biu 的房間"><div class="window"></div><div class="lamp"></div><div class="rug"></div><div class="bubble" id="bubble">你回來啦？</div><div class="cat" id="cat" role="button" tabindex="0" aria-label="摸摸阿 biu"><svg viewBox="0 0 260 250" xmlns="http://www.w3.org/2000/svg"><defs><radialGradient id="fur"><stop stop-color="#a4a9ad"/><stop offset="1" stop-color="#727d85"/></radialGradient><radialGradient id="face"><stop stop-color="#b8bdbe"/><stop offset="1" stop-color="#858f95"/></radialGradient></defs><path d="M200 183 Q256 157 237 98" fill="none" stroke="#78848b" stroke-width="23" stroke-linecap="round"/><ellipse cx="133" cy="170" rx="86" ry="69" fill="url(#fur)"/><ellipse cx="74" cy="216" rx="32" ry="19" fill="#929da2"/><ellipse cx="185" cy="216" rx="32" ry="19" fill="#929da2"/><path d="M58 84 L55 23 Q80 24 98 55 M165 55 Q187 24 212 23 L207 88" fill="#89959a" stroke="#6e7c84" stroke-width="5" stroke-linejoin="round"/><path d="M65 76 L66 39 95 69 M174 69 L201 39 198 76" fill="#b9a4a6"/><ellipse cx="132" cy="106" rx="91" ry="81" fill="url(#face)"/><ellipse cx="91" cy="109" rx="28" ry="24" fill="#e1c786"/><ellipse cx="173" cy="109" rx="28" ry="24" fill="#e1c786"/><ellipse cx="93" cy="109" rx="12" ry="20" fill="#344d3b"/><ellipse cx="171" cy="109" rx="12" ry="20" fill="#344d3b"/><circle cx="89" cy="102" r="5" fill="#fff"/><circle cx="167" cy="102" r="5" fill="#fff"/><ellipse cx="132" cy="143" rx="42" ry="26" fill="#bac0c0"/><path d="M122 138 Q132 131 142 138 L132 146Z" fill="#7e686b"/><path d="M132 146 Q124 158 114 152 M132 146 Q140 158 150 152" fill="none" stroke="#5b6467" stroke-width="3" stroke-linecap="round"/><path d="M91 147 L45 140 M90 154 L43 157 M172 147 L219 140 M172 154 L220 157" stroke="#dde0db" stroke-width="2" stroke-linecap="round"/><path d="M63 168 Q131 193 200 168" fill="none" stroke="#587e76" stroke-width="10"/><circle cx="132" cy="186" r="12" fill="#e8b5b9"/><circle cx="132" cy="186" r="5" fill="#f9dfe0"/></svg></div></section><div class="message" id="message">輕輕點一下阿 biu，跟牠打招呼。</div><div class="actions"><button data-a="pet">♡ 摸摸</button><button data-a="feed">◌ 餵食</button><button data-a="play">✧ 玩耍</button><button data-a="brush">≋ 梳毛</button><button data-a="rest">☾ 休息</button><button data-a="home">⌂ 回家</button></div><div class="note">免費離線遊玩 · 進度儲存在這台裝置</div></main><script>const key="abiu-save-v1";let s;try{s=JSON.parse(localStorage.getItem(key))||{happy:76,full:72,energy:81,close:55}}catch(e){s={happy:76,full:72,energy:81,close:55}}const cat=document.querySelector("#cat"),bubble=document.querySelector("#bubble"),message=document.querySelector("#message");const labels={happy:"開心",full:"飽足",energy:"精神",close:"親密"};function render(){document.querySelector("#meters").innerHTML=Object.entries(labels).map(([k,v])=>'<div class="meter">'+v+' '+s[k]+'<div class="bar"><div class="fill" style="width:'+s[k]+'%"></div></div></div>').join("");localStorage.setItem(key,JSON.stringify(s))}function act(a){let msg="",say="";cat.classList.remove("bounce","sleep");cat.style.left="50%";cat.style.bottom="15%";switch(a){case"pet":s.happy+=9;s.close+=6;msg="阿 biu 瞇起眼睛，輕輕蹭你的手。";say="呼嚕呼嚕 ♡";break;case"feed":s.full+=18;s.happy+=4;msg="阿 biu 吃得津津有味。";say="好吃！";break;case"play":s.happy+=15;s.energy-=14;s.full-=5;msg="阿 biu 追著玩具，開心地撲了過去！";say="再玩一次！";cat.style.left="65%";cat.classList.add("bounce");break;case"brush":s.happy+=6;s.close+=9;msg="柔軟的灰藍毛毛被梳得蓬蓬的。";say="舒服～";break;case"rest":s.energy+=22;s.full-=3;msg="阿 biu 窩在地毯上打盹。";say="Zzz…";cat.classList.add("sleep");break;case"home":s.happy+=11;s.close+=8;msg="你開門了！阿 biu 搖著尾巴過來迎接。";say="你回來啦！";cat.classList.add("bounce");break}for(const k of Object.keys(labels))s[k]=Math.max(0,Math.min(100,s[k]));message.textContent=msg;bubble.textContent=say;render()}document.querySelectorAll("[data-a]").forEach(b=>b.addEventListener("click",()=>act(b.dataset.a)));cat.addEventListener("click",()=>act("pet"));cat.addEventListener("keydown",e=>{if(e.key==="Enter")act("pet")});render();</script></body></html>
