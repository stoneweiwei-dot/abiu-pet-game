const A=document.getElementById('arena'),CAT=document.getElementById('cat'),F=document.getElementById('feather'),P=document.getElementById('props'),H=document.getElementById('hand'),ST=document.getElementById('status'),SCORE=document.getElementById('points'),CLOCK=document.getElementById('clock'),BAR=document.getElementById('bar'),GTitle=document.getElementById('gameTitle'),HINT=document.getElementById('hint');
const state={mode:'hunt',catX:0,catY:0,catRotation:0,featherX:0,featherY:0,drag:false,armed:false,score:0,tries:0,clock:25,started:false,ended:false,lastCatch:0,goal:6,choice:-1,busy:false,hold:false,holdMs:0,lastTime:0,groomStart:null,sound:false,audio:null};
const ranges={hunt:{title:'追羽毛 · 引導牠撲抓',status:'按住羽毛拖動，阿 biu 才會追；牠追到才算一分。',goal:6},treasure:{title:'尋寶 · 帶牠去找零食',status:'選一個藏寶點，阿 biu 會自己走過去嗅聞。',goal:1},groom:{title:'梳毛 · 順著牠的毛流',status:'從阿 biu 的肩背往尾巴方向輕輕滑動。',goal:6},bond:{title:'蹭蹭 · 牠主動靠過來',status:'把手指按在牠臉旁，等牠貼近你的手。',goal:100}};
function size(){return{w:A.clientWidth,h:A.clientHeight}}function clamp(v,l,u){return Math.min(u,Math.max(l,v))}function xy(e){const r=A.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function say(x){ST.textContent=x}function fx(x,y,str='♡'){const e=document.createElement('span');e.className='heart';e.textContent=str;e.style.left=x+'px';e.style.top=y+'px';A.append(e);setTimeout(()=>e.remove(),950)}
function updateCat(){CAT.style.left=state.catX+'px';CAT.style.top=state.catY+'px';CAT.style.transform='translate(-50%,-50%) rotate('+state.catRotation+'deg)'}function feather(){F.style.left=state.featherX+'px';F.style.top=state.featherY+'px'}
function sound(hz=540){if(!state.sound)return;try{const ctx=state.audio||(state.audio=new(window.AudioContext||window.webkitAudioContext)());const osc=ctx.createOscillator(),gain=ctx.createGain(),t=ctx.currentTime;osc.type='sine';osc.frequency.setValueAtTime(hz,t);osc.frequency.exponentialRampToValueAtTime(hz*.62,t+.15);gain.gain.setValueAtTime(.09,t);gain.gain.exponentialRampToValueAtTime(.001,t+.17);osc.connect(gain);gain.connect(ctx.destination);osc.start(t);osc.stop(t+.18)}catch{}}
function setMode(mode){state.mode=mode;state.started=false;state.ended=false;state.score=0;state.tries=0;state.clock=25;state.choice=Math.floor(Math.random()*3);state.busy=false;state.hold=false;state.holdMs=0;state.armed=false;state.drag=false;state.groomStart=null;state.lastTime=0;state.goal=ranges[mode].goal;A.dataset.mode=mode;P.innerHTML='';A.querySelectorAll('.heart,.hop').forEach(x=>x.remove());H.style.display='none';F.style.display=mode==='hunt'?'block':'none';CAT.classList.remove('pouncing');document.querySelectorAll('.mode').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));const{w,h}=size();state.catX=w*.5;state.catY=h*.58;state.catRotation=0;state.featherX=w*.72;state.featherY=h*.31;if(mode==='hunt'){state.catX=w*.3;state.catY=h*.62;HINT.textContent='手指拖動羽毛 · 阿 biu 追到才加分';}else if(mode==='treasure'){state.catX=w*.50;state.catY=h*.70;HINT.textContent='選擇藏寶地點 · 看阿 biu 如何嗅聞';createTreats()}else if(mode==='groom'){HINT.textContent='從頭往尾巴方向梳毛';let e=document.createElement('div');e.className='groom-guide';e.textContent='沿著毛流往上滑動 ⤴';P.append(e)}else{HINT.textContent='輕按靠近牠的頭 · 等牠主動蹭你';}updateCat();feather();GTitle.textContent=ranges[mode].title;say(ranges[mode].status);render()}
function createTreats(){const{w,h}=size();const spot=[[.19,.23],[.50,.25],[.81,.23]];spot.forEach(([px,py],i)=>{const d=document.createElement('div');d.className='treat';d.style.left=w*px+'px';d.style.top=h*py+'px';d.innerHTML='<button aria-label="探查藏寶點 '+(i+1)+'">🛋️</button><small>地點 '+(i+1)+'</small>';d.querySelector('button').addEventListener('click',()=>chooseTreat(i,d));P.append(d)})}
function chooseTreat(i,d){if(state.ended||state.busy||d.dataset.used)return;state.busy=true;state.targetX=d.offsetLeft;state.targetY=d.offsetTop+53;state.targetEl=d;state.targetIndex=i;say('阿 biu 正走過去聞聞看……');state.started=true;}
function checkTreat(){state.busy=false;const d=state.targetEl;d.dataset.used='1';d.querySelector('button').disabled=true;if(state.targetIndex===state.choice){d.querySelector('button').textContent='🐟';state.score=1;fx(state.catX,state.catY-45,'✦');sound(650);finish(true)}else{d.querySelector('button').textContent='☁️';state.tries++;fx(state.catX,state.catY-40,'?');if(state.tries>=2)finish(false);else say('這裡沒有……再帶阿 biu 找一次。')} }
function grantReward(){const mode=state.mode,rewards={hunt:[25,3],treasure:[20,2],groom:[17,2],bond:[28,4]},r=rewards[mode];try{const k='abiu-cozy-v4',v=JSON.parse(localStorage.getItem(k)||'{}');for(const key of ['xp','stars','plays','happy','close'])v[key]=Number(v[key])||0;v.xp+=r[0];v.stars+=r[1];v.plays++;v.happy=Math.min(100,v.happy+5);v.close=Math.min(100,v.close+5);localStorage.setItem(k,JSON.stringify(v));return ' +'+r[0]+' XP · +'+r[1]+' 星星'}catch{return ''}}
function finish(win){state.ended=true;state.started=false;state.drag=false;state.armed=false;state.busy=false;state.hold=false;CAT.classList.remove('pouncing');say(win?'阿 biu 完成挑戰！牠自己做到的。'+grantReward():'挑戰結束。按「重新開始」再陪牠玩。');if(win){sound(820);fx(state.catX,state.catY-56,'♡')}render()}
function render(){SCORE.textContent=state.mode==='bond'?Math.floor(state.holdMs/40)+' / 100':state.score+' / '+state.goal;CLOCK.textContent=state.mode==='hunt'?Math.ceil(state.clock)+' 秒':state.mode==='treasure'?'尋找中':state.mode==='groom'?'梳毛進度':'相處時間';BAR.style.width=clamp((state.mode==='bond'?state.holdMs/4000:state.score/state.goal)*100,0,100)+'%'}
function catchFeather(){if(state.ended||!state.armed||performance.now()-state.lastCatch<450)return;state.lastCatch=performance.now();state.armed=false;state.drag=false;state.score++;CAT.classList.add('pouncing');fx(state.catX,state.catY-35,'✦');sound(710);if(navigator.vibrate)navigator.vibrate(12);setTimeout(()=>CAT.classList.remove('pouncing'),370);render();if(state.score>=6){finish(true);return}const{w,h}=size();const tries=[[w*.76,h*.26],[w*.25,h*.24],[w*.7,h*.70],[w*.25,h*.67]];const dest=tries[(state.score-1)%tries.length];state.featherX=dest[0];state.featherY=dest[1];feather();say('牠抓到了！再移動羽毛，引導下一次撲抓。')}
function nearCat(p,r=84){return Math.hypot(p.x-state.catX,p.y-state.catY)<r}
A.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;const p=xy(e);if(state.ended)return;if(state.mode==='hunt'){if(Math.hypot(p.x-state.featherX,p.y-state.featherY)>95){say('從羽毛附近開始拖動，阿 biu 才會跟著玩。');return}state.drag=true;state.started=true;A.setPointerCapture(e.pointerId);state.featherX=p.x;state.featherY=p.y;feather()}else if(state.mode==='groom'){if(nearCat(p)){state.groomStart=p;A.setPointerCapture(e.pointerId)}}else if(state.mode==='bond'){if(nearCat(p,110)){state.hold=true;state.handX=p.x;state.handY=p.y;H.style.display='block';H.style.left=p.x+'px';H.style.top=p.y+'px';A.setPointerCapture(e.pointerId);say('牠正在靠過來……')}}});
A.addEventListener('pointermove',e=>{const p=xy(e);if(state.mode==='hunt'&&state.drag){const{w,h}=size();state.featherX=clamp(p.x,28,w-28);state.featherY=clamp(p.y,35,h-35);state.armed=Math.hypot(state.catX-state.featherX,state.catY-state.featherY)>50;feather()}else if(state.mode==='bond'&&state.hold){state.handX=p.x;state.handY=p.y;H.style.left=p.x+'px';H.style.top=p.y+'px'}});
function release(e){const p=xy(e);if(state.mode==='groom'&&state.groomStart&&!state.ended){const start=state.groomStart;const dy=p.y-start.y;const dx=p.x-start.x;state.groomStart=null;if(dy< -42&&Math.abs(dx)<Math.abs(dy)*.8){state.score++;fx(state.catX-8,state.catY-60,'♡');CAT.style.filter='drop-shadow(0 10px 9px #473d3055) brightness(1.08)';setTimeout(()=>CAT.style.filter='',240);sound(470);say('阿 biu 舒服地放鬆了，再輕梳幾下。');if(state.score>=6)finish(true);render()}else say('順著毛流，從肩背向尾巴方向慢慢滑動。')}state.drag=false;state.hold=false;H.style.display='none'}
A.addEventListener('pointerup',release);A.addEventListener('pointercancel',release);
let prev=performance.now();function tick(now){const delta=Math.min((now-prev)/1000,.06);prev=now;const m=state.mode;if(!state.ended){if(m==='hunt'&&state.started){state.clock-=delta;if(state.clock<=0){state.clock=0;finish(false)}else if(state.drag){const dx=state.featherX-state.catX,dy=state.featherY-state.catY,dist=Math.hypot(dx,dy);if(dist>1){let step=Math.min(dist,delta*125);state.catX+=dx/dist*step;state.catY+=dy/dist*step;state.catRotation=Math.atan2(dy,dx)*180/Math.PI-90;updateCat()}if(dist<58&&state.armed)catchFeather()}render()}else if(m==='treasure'&&state.busy){const dx=state.targetX-state.catX,dy=state.targetY-state.catY,dist=Math.hypot(dx,dy);const step=Math.min(dist,delta*95);if(dist>3){state.catX+=dx/dist*step;state.catY+=dy/dist*step;state.catRotation=Math.atan2(dy,dx)*180/Math.PI-90;updateCat()}else checkTreat()}else if(m==='bond'&&state.hold){const dx=state.handX-state.catX,dy=state.handY-state.catY,dist=Math.hypot(dx,dy);if(dist<115&&dist>12){const d=Math.min(dist,delta*26);state.catX+=dx/dist*d;state.catY+=dy/dist*d;state.catRotation=Math.atan2(dy,dx)*180/Math.PI-90;updateCat()}if(dist<110){state.holdMs=Math.min(4000,state.holdMs+delta*1000);if(now-state.lastCatch>730){fx(state.catX,state.catY-48,'♡');sound(410);state.lastCatch=now}render();if(state.holdMs>=4000)finish(true)}}}requestAnimationFrame(tick)}requestAnimationFrame(tick);
document.querySelectorAll('.mode').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));document.getElementById('reset').addEventListener('click',()=>setMode(state.mode));document.getElementById('toggleAudio').addEventListener('click',e=>{state.sound=!state.sound;e.currentTarget.textContent='音效：'+(state.sound?'開':'關');e.currentTarget.setAttribute('aria-pressed',String(state.sound))});window.addEventListener('resize',()=>setMode(state.mode));const requested=new URLSearchParams(location.search).get('mode');setMode(Object.hasOwn(ranges,requested)?requested:'hunt');
</script></body></html>
